<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🤍</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center}
#msg{font-size:2rem;line-height:1.5;opacity:0;transition:opacity 1s ease}
.show{opacity:1}
.heart{position:fixed;top:-20px;color:#ff5c8a;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh)}}
small{font-size:1rem;color:#ddd}
</style>
</head>
<body>
<div id="wrap"><div id="msg"></div></div>
<script>
const pages=[
"Merhabalar Dünyalar Güzelim... 🤍",
"Bu sadece küçük bir sayfa değil...<br><br>Kalbimin sana bıraktığı minicik bir not. ❤️",
"SENİ ÇOK ÖZLEDİM...",
"Her geçen gün...<br><br>Seni daha çok özledim,<br>daha çok sevdim. ❤️",
"Seni her gün daha fazla seviyorum. 🤍",
"Bir şey eksik...",
"O da sensin. ❤️<br><br><small>İyi ki varsın...</small>"
];
const waits=[2500,3500,3000,3500,3000,2000,999999];
let i=0;
const el=document.getElementById("msg");
function next(){
  el.classList.remove("show");
  setTimeout(()=>{
    el.innerHTML=pages[i];
    el.classList.add("show");
    setTimeout(()=>{i++; if(i<pages.length) next();}, waits[i]);
  },700);
}
next();
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.textContent="❤";
 h.style.left=Math.random()*100+"vw";
 h.style.fontSize=(12+Math.random()*20)+"px";
 h.style.animationDuration=(4+Math.random()*5)+"s";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),9000);
},350);
</script>
</body>
</html>
